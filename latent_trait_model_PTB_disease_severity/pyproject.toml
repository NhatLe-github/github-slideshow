[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-trait-model-ptb-disease-severity"
version = "0.1.0"
description = "Latent trait modelling toolkit for PTB disease severity estimation"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "scipy>=1.9",
    "torch>=2.0",
    "pyro-ppl>=1.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2",
    "black>=23.1",
    "ruff>=0.1.6"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
